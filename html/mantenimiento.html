<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import Tech BA | Mantenimiento</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="icon" href="../favicon.ico">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Inter',sans-serif;

            min-height: 100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:
                radial-gradient(circle at top,#5b2b78 0%,transparent 40%),
                linear-gradient(135deg,#111827,#1f2937,#0f172a);

            color:white;
        }

        .card{
            width:min(90%,600px);

            padding:55px 45px;
            margin: 20px;

            background:rgba(255,255,255,.08);
            backdrop-filter:blur(15px);

            border:1px solid rgba(255,255,255,.15);
            border-radius:20px;

            text-align:center;

            box-shadow:0 20px 50px rgba(0,0,0,.45);
        }

        .logo{
            width:120px;
            margin-bottom:25px;
            border-radius: 500px;
        }

        h1{
            font-size:2.2rem;
            margin-bottom:18px;
            font-weight:700;
        }

        p{
            font-size:1.05rem;
            color:#d4d4d8;
            line-height:1.7;
        }

        .icon{
            font-size:70px;
            margin-bottom:25px;
        }

        .line{
            width:70px;
            height:4px;
            margin:30px auto 0;
            border-radius:50px;
            background:#cd7fec;
        }

        @media(max-width:600px){

            .card{
                padding:40px 25px;
            }

            h1{
                font-size:1.7rem;
            }

            p{
                font-size:.95rem;
            }

            .icon{
                font-size:55px;
            }
        }

    </style>

</head>

<body>

    <div class="card">

        <img src="../img/og-image.png" class="logo" alt="Import Tech">

        <div class="icon">🛠️</div>

        <h1>Sitio en mantenimiento</h1>

        <p>
            Estamos realizando cambios para brindarte una mejor experiencia.
            <br><br>
            Volveremos pronto.
        </p>

        <div class="line"></div>

    </div>

</body>

</html>
